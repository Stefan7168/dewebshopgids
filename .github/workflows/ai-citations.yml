# Monthly AI citation check (launch scope, DECISIONS 2026-10-28): 20 fixed prompts to
# Claude with web search; results in ai_citation_checks for the SEO/Growth Analyst.
name: AI citation check

on:
  schedule:
    - cron: "0 6 2 * *" # 2nd of the month, 07:00 or 08:00 Amsterdam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-citations
  cancel-in-progress: false

jobs:
  check:
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ask the prompts
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/seo/ai-citations.ts
