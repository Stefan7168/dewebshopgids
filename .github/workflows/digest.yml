# Weekly digest, Sunday 18:00 Europe/Amsterdam (plan v3 section 8, step 16).
# Two UTC crons cover summer and winter time; scripts/ops/digest.ts exits unless
# it is 18:00 in Amsterdam. Manual runs pass FORCE_RUN=1.
name: Weekly digest

on:
  schedule:
    - cron: "0 16 * * 0" # 18:00 CEST
    - cron: "0 17 * * 0" # 18:00 CET
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  # Skip, without a failure email, while the production secrets are not set yet.
  # A manual run still fails, so a missing secret stays visible when you test.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: |
          missing=""
          for name in PIPELINE_DATABASE_URL; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped: secrets not set in the production environment:$missing"
          [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]
  digest:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Queue the digest
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npx tsx scripts/ops/digest.ts
