# Hourly backstop: every confirmed removal or objection is applied within the hour
# (plan v3 section 7, step 9). The confirm action normally removes the shop at once.
name: Dispute removals

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispute-removals
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply confirmed removals
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: npx tsx scripts/disputes/enforce-removals.ts
