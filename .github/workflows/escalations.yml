# Files agent_escalations rows as GitHub issues every 3 hours (plan v3 section 9).
# Routines have no GitHub access; this job is their only path to an issue.
name: File escalations

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: escalations
  cancel-in-progress: false

jobs:
  # Skip, without a failure email, while the production secrets are not set yet.
  # A manual run still fails, so a missing secret stays visible when you test.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: |
          missing=""
          for name in PIPELINE_DATABASE_URL; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped: secrets not set in the production environment:$missing"
          [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]
  file:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: File new escalations
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/ops/file-escalations.ts
      - name: Send due emails
        if: ${{ !cancelled() }} # owner alerts still go out when the step above failed
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STRIPE_BADGE_LINK: ${{ vars.STRIPE_BADGE_LINK }}
        run: npx tsx scripts/email/send-queue.ts
