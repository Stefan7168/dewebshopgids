# Code health checks every 6 hours (plan v3 section 8, step 15).
# Writes health_checks rows; the Ops Watchdog routine reads them.
name: Health checks

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  checks:
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run health checks
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: npx tsx scripts/ops/health.ts checks
