# Fails a PR whose linked issue got the `agent-ok` label from a bot.
# Only a human may apply `agent-ok` (plan section 9).
name: Label guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  issues: read
  pull-requests: read

jobs:
  label-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check who applied agent-ok on linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          issues=$(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          for n in $issues; do
            bad=$(gh api --paginate "repos/$REPO/issues/$n/events" \
              --jq '.[] | select(.event=="labeled" and .label.name=="agent-ok" and .actor.type!="User") | .actor.login')
            if [ -n "$bad" ]; then
              echo "::error::agent-ok on issue #$n was applied by a non-human account: $bad"
              exit 1
            fi
          done
          echo "OK: linked issues: ${issues:-none}"
