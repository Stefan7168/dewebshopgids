# Nightly pipeline at 01:00 Europe/Amsterdam (plan v3 section 8, step 10).
# Two UTC crons cover summer and winter time; scripts/pipeline/nightly.ts exits
# unless it is 01:00 in Amsterdam. Manual runs pass FORCE_RUN=1.
name: Nightly pipeline

on:
  schedule:
    - cron: "0 23 * * *" # 01:00 CEST
    - cron: "0 0 * * *" # 01:00 CET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  # Skip, without a failure email, while the production secrets are not set yet.
  # A manual run still fails, so a missing secret stays visible when you test.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          for name in PIPELINE_DATABASE_URL ANTHROPIC_API_KEY; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped: secrets not set in the production environment:$missing"
          [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]
  nightly:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline steps
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npx tsx scripts/pipeline/nightly.ts
