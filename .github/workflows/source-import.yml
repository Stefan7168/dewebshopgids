# Weekly import of public source lists into source_lists (plan v3 section 8, step 1).
name: Source list import

on:
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC (03:00 or 04:00 Amsterdam)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-import
  cancel-in-progress: false

jobs:
  # Skip, without a failure email, while the production secrets are not set yet.
  # A manual run still fails, so a missing secret stays visible when you test.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: |
          missing=""
          for name in PIPELINE_DATABASE_URL; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped: secrets not set in the production environment:$missing"
          [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]
  import:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import Thuiswinkel members
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx scripts/pipeline/import-source-lists.ts
