# Weekly import of public source lists into source_lists (plan v3 section 8, step 1).
name: Source list import

on:
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC (03:00 or 04:00 Amsterdam)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-import
  cancel-in-progress: false

jobs:
  import:
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import Thuiswinkel members
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx scripts/pipeline/import-source-lists.ts
